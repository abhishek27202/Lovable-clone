services:

  lovable-db:
    image: postgres:16
    ports:

      - "5432:5432"
    container_name: lovable-postgres
    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - lovable-postgres-data:/var/lib/postgresql/data

    networks:
      - lovable-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  lovable-app:
    image: lovable-clone:1.0
    container_name: lovable-application
    restart: always

    ports:
      - "8081:8080"

    env_file:
      - .env

    depends_on:
      lovable-db:
        condition: service_healthy

    networks:
      - lovable-network

volumes:
  lovable-postgres-data:

networks:
  lovable-network:
    driver: bridge